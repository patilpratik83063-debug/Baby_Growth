<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | GeoGrowth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="e-chatgpt" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.5v11M7.2 9.2l9.6 5.6M7.2 14.8l9.6-5.6"/></g></symbol>
  <symbol id="e-claude" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></g></symbol>
  <symbol id="e-gemini" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5c.8 5.6 4.9 9.7 10.5 10.5-5.6.8-9.7 4.9-10.5 10.5C11.2 16.9 7.1 12.8 1.5 12 7.1 11.2 11.2 7.1 12 1.5Z"/></symbol>
  <symbol id="e-perplexity" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2v20M5 7l7 5 7-5M5 7v10l7-5 7 5V7M5 7h14"/></g></symbol>
</defs></svg>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="auth-wrap">
  <div class="bg-grid" aria-hidden="true"><div class="bg-grid__cells" id="bgGrid"></div></div>
  <div class="auth-card">
    <a href="index.html" class="logo"><svg class="logo__mark" viewBox="0 0 26 22" aria-hidden="true"><rect x="0" y="12" width="6" height="10" rx="1.5" fill="#171717"/><rect x="10" y="6" width="6" height="16" rx="1.5" fill="#171717"/><rect x="20" y="0" width="6" height="22" rx="1.5" fill="#f25533"/></svg><span class="logo__text">Geo<span>Growth</span></span></a>

    <form id="loginForm" novalidate>
      <h1>Welcome back</h1>
      <p class="lead">Sign in with your login ID and password.</p>
      <div class="field"><label for="loginId">Login ID or email</label><input id="loginId" autocomplete="username" autocapitalize="off" spellcheck="false" /></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" /></div>
      <button class="btn btn--dark" type="submit" id="loginBtn">Sign in</button>
      <p class="auth-alt" id="signupHint" hidden>New here? <a href="onboarding.html">Create an account</a></p>
    </form>
  </div>
</div>
<script src="shared.js"></script>
<script>
(function () {
  const { mountBgGrid, toast } = window.GG;
  const $ = (s) => document.querySelector(s);
  mountBgGrid($("#bgGrid"));
  const done = () => { location.href = "app.html"; };
  fetch("/api/users/me", { credentials: "same-origin" }).then((r) => { if (r.ok) done(); });
  fetch("/api/auth/config").then((r) => r.json()).then((c) => { $("#signupHint").hidden = !c.data?.signupsOpen; }).catch(() => {});
  $("#loginId").focus();
  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const id = $("#loginId").value.trim(), password = $("#password").value;
    if (!id || !password) return toast("Enter your login ID and password.");
    $("#loginBtn").disabled = true;
    try {
      const r = await fetch("/api/auth/sign-in", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, password }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.message || "Sign-in failed.");
      done();
    } catch (err) { toast(err.message); $("#password").select(); } finally { $("#loginBtn").disabled = false; }
  };
})();
</script>
</body>
</html>
